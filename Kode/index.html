<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NILAI SISWA</title>
    <link rel="stylesheet" href="kode.css" />
    <script src="Kode.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>KATEGORI KELULUSAN SISWA</h1>

        <div class="form-group">
            <label for="NAMA">Masukkan nama siswa:</label>
            <input type="text" id="NAMA" placeholder="MASUKKAN NAMA" />
        </div>

        <div class="form-group">
            <label for="NILAI">Masukkan nilai siswa:</label>
            <input type="number" id="NILAI" placeholder="MASUKKAN NILAI" />
        </div>

        <button onclick="NILAISISWA()">Deskripsi nilai siswa</button>
        <p id="Pesan" class="pesan" aria-live="polite"></p>
    </div>

    <div class="Summary">
        <h2>Hasil</h2>
        <div id="NamaSiswa">Nama siswa</div>
        <div id="NilaiSiswa">Nilai siswa:0</div>
        <div id="Grade">Grade terakhir:</div>
        <div id="Statuskelulusan"> Status kelulusan:</div>
        
    </div>
</body>
</html>
